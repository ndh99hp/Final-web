{% extends 'base.html' %}
{% block title %}Sản phẩm{% endblock %}

{% block content %}
<section>
    <div class="container" style="padding: 40px 0;">
        <h2 class="text-center">Danh sách sản phẩm</h2>

        <div class="row" style="margin-top: 20px;">
            {% for p in products %}
            <div class="col-sm-3" style="margin-bottom: 30px;">
                <a href="{% url 'product_detail' p.id %}">
                    <img src="{{ p.image.url }}" style="width:100%; height:200px; object-fit:cover;">
                    <h4>{{ p.title }}</h4>
                    <p style="color:red;">${{ p.price }}</p>
                </a>
            </div>
            {% empty %}
            <p class="text-center">Chưa có sản phẩm nào.</p>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
