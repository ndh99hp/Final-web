{% extends 'base.html' %}
{% block title %}{{ product.title }}{% endblock %}

{% block content %}
<section>
    <div class="container" style="padding: 40px 0;">
        <div class="row">
            <div class="col-sm-6">
                <img src="{{ product.image.url }}" style="width:100%;">
            </div>
            <div class="col-sm-6">
                <h2>{{ product.title }}</h2>
                <h3 style="color:red;">${{ product.price }}</h3>
                <p>Người đăng: {{ product.author }}</p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
