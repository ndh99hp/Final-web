{% load static %}
<header id="header">
    <div class="header_top">
        <div class="container"> 
            <div class="row">
                <div class="col-sm-6">
                    <div class="contactinfo">
                        <ul class="nav nav-pills">
                            <li><a href=""><i class="fa fa-phone"></i> +2 95 01 88 821</a></li>
                            <li><a href=""><i class="fa fa-envelope"></i> info@domain.com</a></li>
                        </ul>
                    </div>
                </div>
                <div class="col-sm-6">
                    <div class="social-icons pull-right">
                        <ul class="nav navbar-nav">
                            <li><a href=""><i class="fa fa-facebook"></i></a></li>
                            <li><a href=""><i class="fa fa-twitter"></i></a></li>
                            <li><a href=""><i class="fa fa-google-plus"></i></a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="header-middle">
        <div class="container">
            <div class="row">
                <div class="col-md-4 clearfix">
                    <div class="logo pull-left">
                        <a href="{% url 'blog_list' %}"><img src="{% static 'images/home/logo.png' %}" alt=""></a>
                    </div>
                </div>
                <div class="col-md-8 clearfix">
                    <div class="shop-menu clearfix pull-right">
                        <ul class="nav navbar-nav">
                            <!-- TODO: bật lại khi có app cart/checkout -->
                            <!-- <li><a href=""><i class="fa fa-shopping-cart"></i> Cart</a></li> -->
                            {% if user.is_authenticated %}
                                <li><a href="{% url 'account_update' %}"><i class="fa fa-user"></i> Xin chào, {{ user.username }}</a></li>
                                <li><a href="{% url 'logout' %}"><i class="fa fa-lock"></i> Đăng xuất</a></li>
                            {% else %}
                                <li><a href="{% url 'login' %}"><i class="fa fa-lock"></i> Đăng nhập</a></li>
                                <li><a href="{% url 'register' %}"><i class="fa fa-lock"></i> Đăng ký</a></li>
                            {% endif %}
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="header-bottom">
        <div class="container">
            <div class="row">
                <div class="col-sm-9">
                    <div class="navbar-header">
                        <button type="button" class="navbar-toggle" data-toggle="collapse" data-target=".navbar-collapse">
                            <span class="sr-only">Toggle navigation</span>
                            <span class="icon-bar"></span>
                            <span class="icon-bar"></span>
                            <span class="icon-bar"></span>
                        </button>
                    </div>
                    <div class="mainmenu pull-left">
                        <ul class="nav navbar-nav collapse navbar-collapse">
                            <li><a href="{% url 'blog_list' %}">Trang chủ</a></li>
                            <li class="dropdown">
                                <a href="#" class="active">Blog <i class="fa fa-angle-down"></i></a>
                                <ul role="menu" class="sub-menu">
                                    <li><a href="{% url 'blog_list' %}" class="active">Danh sách Blog</a></li>
                                </ul>
                            </li>
                            <li><a href="{% url 'product_list' %}">Sản phẩm</a></li>
                        </ul>
                    </div>
                </div>
                <div class="col-sm-3">
                    <div class="search_box pull-right">
                        <input type="text" placeholder="Tìm kiếm"/>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>
